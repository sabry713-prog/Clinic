[project]
name = "veritas-graph"
version = "0.1.0"
description = "Veritas-Medica knowledge graph: Neo4j client, NPHIES ontology ingestion, necessity queries"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
