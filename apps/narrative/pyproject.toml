[project]
name = "narrative"
version = "0.1.0"
description = "Clinical Copilot narrative generation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "grpcio>=1.63.0",
    "grpcio-health-checking>=1.63.0",
    "grpcio-tools>=1.63.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "asyncpg>=0.29.0",
    "blocklist",
    "retrieval",
    "httpx>=0.28.1",
    "phi-guard",
    "prompt_loader",
]

[tool.uv.sources]
blocklist = { path = "../../packages/blocklist", editable = true }
retrieval = { path = "../../packages/retrieval", editable = true }
phi-guard = { path = "../../packages/phi-guard", editable = true }
prompt_loader = { path = "../../packages/prompt_loader", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.5",
    "grpcio-testing>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "N"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# src-layout: resolve modules through src/ only, so config.py isn't seen
# twice (as narrative.config AND src.narrative.config) when running `mypy .`.
mypy_path = "src"
explicit_package_bases = true

# Stubless/untyped deps (in-house workspace packages without py.typed markers
# yet, and asyncpg/grpc which ship no stubs) -- type-check everything else
# strictly; these imports stay Any rather than blocking the build.
[[tool.mypy.overrides]]
module = [
  "asyncpg",
  "grpc.*",
  "grpc_health.*",
  "blocklist",
  "retrieval.*",
  "phi_guard",
]
ignore_missing_imports = true

# grpc_server subclasses grpcio's HealthServicer / generated servicer bases,
# which resolve to Any without stubs -- subclassing-Any is expected there.
[[tool.mypy.overrides]]
module = "narrative.grpc_server"
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/narrative"]
